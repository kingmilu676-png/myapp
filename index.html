<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facing AI Smart Trend - Milu</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }

        .container {
            max-width: 440px;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
        }

        h2 {
            color: #00e676;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .timer-box {
            font-size: 24px;
            font-weight: bold;
            color: #ff9800;
            margin: 10px 0;
            background: #2a2a2a;
            padding: 8px;
            border-radius: 8px;
        }

        .period-box {
            font-size: 16px;
            color: #b0bec5;
            margin-bottom: 10px;
        }

        .prediction-card {
            background: #252525;
            border: 2px solid #00e676;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .prediction-card h3 {
            margin: 0 0 8px 0;
            color: #00e676;
            font-size: 16px;
        }

        .pred-num-box {
            font-size: 42px;
            font-weight: bold;
            color: #00e676;
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }

        .pred-details {
            font-size: 14px;
            color: #b0bec5;
        }

        .history-container {
            margin-top: 20px;
            text-align: left;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .history-container h3 {
            margin-top: 0;
            font-size: 15px;
            color: #90caf9;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }

        .history-item {
            padding: 8px 6px;
            border-bottom: 1px solid #333;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-big {
            background: #4caf50;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        .badge-small {
            background: #ff5252;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        .status-win {
            background: #2e7d32;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .status-loss {
            background: #c62828;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Facing AI Smart Trend - Milu</h2>
        <div class="period-box">Period: <span id="periodNumber"
                style="color: #fff; font-weight: bold;">Loading...</span></div>
        <div class="timer-box">Time Left: <span id="timer">30</span>s</div>

        <div class="prediction-card">
            <h3>Top Chance Predicted Number</h3>
            <div class="pred-num-box" id="predNum">-</div>
            <div class="pred-details">
                Type: <span id="predType">-</span> | Color: <span id="predColor">-</span>
            </div>
        </div>

        <div class="history-container">
            <h3>Live History & Win/Loss Status</h3>
            <div id="historyList">Loading history...</div>
        </div>
    </div>

    <!-- Socket.IO Client Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('timerUpdate', (data) => {
            // Period Number Update
            if (data.periodNumber && data.periodNumber !== "Loading...") {
                document.getElementById('periodNumber').innerText = data.periodNumber;
            }

            // Countdown Timer Update
            if (data.countdown !== undefined) {
                document.getElementById('timer').innerText = data.countdown;
            }

            // Live Prediction Update
            if (data.prediction) {
                document.getElementById('predNum').innerText = data.prediction.suggestedNum;
                document.getElementById('predType').innerText = data.prediction.suggestedType;
                document.getElementById('predColor').innerText = data.prediction.suggestedColor;
                document.getElementById('predColor').style.color = data.prediction.suggestedColor === 'Red' ? '#ff5252' : '#4caf50';
            }

            // History Update
            if (data.history && data.history.length > 0) {
                let html = '';
                data.history.forEach(item => {
                    const badgeClass = item.type === 'Big' ? 'badge-big' : 'badge-small';
                    let statusHtml = '<span style="color:#aaa;">PENDING</span>';

                    if (item.status === 'WIN') {
                        statusHtml = '<span class="status-win">WIN</span>';
                    } else if (item.status === 'LOSS') {
                        statusHtml = '<span class="status-loss">LOSS</span>';
                    }

                    html += `<div class="history-item">
                        <span><b>${String(item.issue).slice(-4)}</b></span>
                        <span>Res: <b>${item.number}</b> <span class="${badgeClass}">${item.type}</span></span>
                        <span>Pred: <b>${item.predNum ?? '-'}</b></span>
                        <span>${statusHtml}</span>
                    </div>`;
                });
                document.getElementById('historyList').innerHTML = html;
            }
        });
    </script>
</body>

</html>
